# A144: all Kalpa worlds work in PARALLEL (one job per world) on free models, every hour + on demand.
# Queues: 00-hq/tasks/<world>.json. Results: 00-hq/knowledge/<id>.md (status "review").
# Secrets (set by Akhil): GROQ_API_KEY, OPENROUTER_API_KEY, GEMINI_API_KEY. Each world starts on a different free provider.
name: agents
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      max: { description: "tasks per world this run", default: "2" }
permissions:
  contents: write
concurrency: { group: agents, cancel-in-progress: false }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pytest==8.4.2 && KL_RETRY_WAIT=0 python3 00-hq/agents/test_runner.py && python3 00-hq/agents/test_reach.py && python3 -m pytest -q 00-hq/agents/test_autoresearch.py
  world:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        include:
          # 50-50 (Akhil, 6 Nov 2026): 4 worlds start on Google Gemini (free tier), 4 on our Groq/OpenRouter setup.
          - { world: b1, prefer: groq }
          - { world: b2, prefer: gemini }
          - { world: b3, prefer: openrouter }
          - { world: b4, prefer: gemini }
          - { world: b5, prefer: groq }
          - { world: b6, prefer: gemini }
          - { world: b7, prefer: openrouter }
          - { world: b8, prefer: groq }
          - { world: hq, prefer: gemini }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false  # third-party Agent-Reach code runs in this job; the push token is added only in the save step
      # Agent-Reach v1.6.1 (MIT) for no-login YouTube captions / Reddit / GitHub / web reads (00-hq/agents/reach.py).
      # NOT `pip install agent-reach`: that PyPI name is a different project. Pinned release zip + sha256, own venv,
      # --no-deps so yt-dlp's GPL extra (mutagen) is never installed. If this fails, agents run without it.
      - name: Install Agent-Reach 1.6.1 (pinned)
        continue-on-error: true
        run: |
          curl -fsSL -o "$RUNNER_TEMP/agent-reach.zip" https://github.com/Panniantong/Agent-Reach/releases/download/v1.6.1/agent-reach.zip
          echo "51443d733bcb26064262442083a8f8abf6ba5e3e7df54beebafe98c88be04a60  $RUNNER_TEMP/agent-reach.zip" | sha256sum -c -
          python3 -m venv "$RUNNER_TEMP/ar"
          "$RUNNER_TEMP/ar/bin/pip" install -q --no-deps "$RUNNER_TEMP/agent-reach.zip"
          "$RUNNER_TEMP/ar/bin/pip" install -q requests==2.32.5 loguru==0.7.3 PyYAML==6.0.3 yt-dlp==2026.8.19 yt-dlp-ejs==0.8.0
          "$RUNNER_TEMP/ar/bin/agent-reach" version
      - name: Agents of ${{ matrix.world }} work their queue
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}  # optional: Workers AI free backup
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KL_PREFER: ${{ matrix.prefer }}
          KL_AGENT_REACH: ${{ runner.temp }}/ar/bin/agent-reach
        run: python3 00-hq/agents/runner.py --world ${{ matrix.world }} --max "${{ github.event.inputs.max || '2' }}"
      - name: Save results (each world only touches its own queue file)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git config user.name "kalpa-agents"
          git config user.email "84580207+Akhilkanigicharla@users.noreply.github.com"
          git add 00-hq/tasks/${{ matrix.world }}.json 00-hq/knowledge || true
          git diff --cached --quiet && exit 0
          git commit -q -m "agents(${{ matrix.world }}): queue run $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep $((RANDOM % 10 + 3)); done; exit 1
  improve:
    # Autoresearch ON (Akhil, 11 Nov 2026): after all worlds ran, score agents by Vigil pass rate, keep/revert pending
    # playbook lines, start at most one new experiment. No LLM calls, no network. Method: chrisworsey55/atlas-gic (MIT).
    needs: world
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git pull -q --rebase https://github.com/${{ github.repository }}.git ${{ github.ref_name }} || true
      - run: python3 00-hq/agents/autoresearch.py --write
      - name: Save ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git config user.name "kalpa-agents"
          git config user.email "84580207+Akhilkanigicharla@users.noreply.github.com"
          git add 00-hq/agents/autoresearch-ledger.json
          git diff --cached --quiet && exit 0
          git commit -q -m "agents: autoresearch cycle $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep $((RANDOM % 10 + 3)); done; exit 1
