# A144: all Kalpa worlds work in PARALLEL (one job per world) on free models, every hour + on demand.
# Queues: 00-hq/tasks/<world>.json. Results: 00-hq/knowledge/<id>.md (status "review").
# Secrets (set by Akhil): GROQ_API_KEY, OPENROUTER_API_KEY, GEMINI_API_KEY. Each world starts on a different free provider.
name: agents
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      max: { description: "tasks per world this run", default: "2" }
permissions:
  contents: write
concurrency: { group: agents, cancel-in-progress: false }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: KL_RETRY_WAIT=0 python3 00-hq/agents/test_runner.py && python3 00-hq/agents/test_memory.py
  world:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          # 50-50 (Akhil, 6 Nov 2026): 4 worlds start on Google Gemini (free tier), 4 on our Groq/OpenRouter setup.
          - { world: b1, prefer: groq }
          - { world: b2, prefer: gemini }
          - { world: b3, prefer: openrouter }
          - { world: b4, prefer: gemini }
          - { world: b5, prefer: groq }
          - { world: b6, prefer: gemini }
          - { world: b7, prefer: openrouter }
          - { world: hq, prefer: gemini }
    steps:
      - uses: actions/checkout@v4
      - name: Agents of ${{ matrix.world }} work their queue
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KL_PREFER: ${{ matrix.prefer }}
        run: python3 00-hq/agents/runner.py --world ${{ matrix.world }} --max "${{ github.event.inputs.max || '2' }}"
      - name: Save results (each world only touches its own queue file)
        run: |
          git config user.name "kalpa-agents"
          git config user.email "84580207+Akhilkanigicharla@users.noreply.github.com"
          git add 00-hq/tasks/${{ matrix.world }}.json 00-hq/knowledge 00-hq/agents/memory || true
          git diff --cached --quiet && exit 0
          git commit -q -m "agents(${{ matrix.world }}): queue run $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep $((RANDOM % 10 + 3)); done; exit 1
