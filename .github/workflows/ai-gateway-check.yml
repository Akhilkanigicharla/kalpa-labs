name: AI Gateway check
# Manual run: proves the Vercel AI Gateway key works with the AI SDK.
# Needs repo secret AI_GATEWAY_API_KEY (Akhil sets it himself; never in code or chat).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: 00-hq/ai-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Run example
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: npm start
