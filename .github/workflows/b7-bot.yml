# b7 daily trading bot (A153). Practice mode (dry run) until ALL three Live Guard switches are on:
#   1. repo variable KL_LIVE = yes   2. a real broker adapter + Akhil's broker secrets   3. trial verdict "pass".
# Kill switch: create the file 07-trading/KILL (or set repo variable KL_KILL = 1). Alerts: CEO_CHAT_ID only.
name: b7 trading bot (daily)

on:
  schedule:
    - cron: "20 10 * * 1-5"   # 15:50 IST, after the NSE close
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b7-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 07-trading
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 07-trading/requirements.txt
      - run: pip install -q -r requirements.txt
      - name: Bot run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CEO_CHAT_ID: ${{ secrets.CEO_CHAT_ID }}
          KL_LIVE: ${{ vars.KL_LIVE }}
          KL_KILL: ${{ vars.KL_KILL }}
          KL_LIVE_CAPITAL: ${{ vars.KL_LIVE_CAPITAL || '5000' }}
        run: python -m src.bot --strategy "${{ vars.KL_STRATEGY || 'ma_filter' }}" --trial "${{ vars.KL_TRIAL }}" --symbols "${{ vars.KL_SYMBOLS || 'NIFTYBEES,GOLDBEES' }}"
      - name: Save bot state
        run: |
          git config user.name "Akhilkanigicharla"
          git config user.email "84580207+Akhilkanigicharla@users.noreply.github.com"
          git add research/bot-state.json
          git diff --cached --quiet && exit 0
          git commit -q -m "b7 bot: state $(date -u +%F)"
          for _ in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep $((RANDOM % 10 + 3)); done; exit 1
