# Runs the BotBhai lead finder in GitHub's free cloud (nothing installed on your PC).
# GitHub → Actions → "BotBhai lead finder" → Run workflow. Results are a private download (Actions artifact, kept 7 days):
# lead lists hold phone numbers (DPDP personal data), so they never go into git.
name: BotBhai lead finder
on:
  workflow_dispatch:
    inputs:
      city:   { description: "City (OpenStreetMap name)", default: "Hyderabad" }
      niches: { description: "Space-separated: salon gym realestate examkits", default: "salon gym realestate examkits" }
      near:   { description: "Optional walking cluster centre 'lat,lon' (Ameerpet metro: 17.4375,78.4482)", default: "" }
      radius: { description: "Cluster radius in metres (with near)", default: "1200" }
  push:
    paths: [".github/workflows/leadfinder.yml", "01-botbhai/botbhai/leadfinder/leadfinder.py"]
permissions:
  contents: read
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install openpyxl==3.1.5
      - name: Find leads
        # inputs arrive as environment variables, never pasted into the script (avoids shell injection)
        env:
          CITY: ${{ github.event.inputs.city || 'Hyderabad' }}
          NICHES: ${{ github.event.inputs.niches || 'salon gym realestate examkits' }}
          NEAR: ${{ github.event.inputs.near }}
          RADIUS: ${{ github.event.inputs.radius || '1200' }}
        run: |
          mkdir -p 01-botbhai/botbhai/leads
          read -r -a NICHE_LIST <<< "$NICHES"
          if [ -n "$NEAR" ]; then
            python 01-botbhai/botbhai/leadfinder/leadfinder.py --city "$CITY" --niche "${NICHE_LIST[@]}" --near "$NEAR" --radius "$RADIUS" --out "01-botbhai/botbhai/leads/cluster-leads"
          else
            python 01-botbhai/botbhai/leadfinder/leadfinder.py --city "$CITY" --niche "${NICHE_LIST[@]}" --out "01-botbhai/botbhai/leads/${CITY,,}-leads"
          fi
      - name: Enrich from business websites (robots.txt respected)
        run: |
          for f in 01-botbhai/botbhai/leads/*-leads.csv; do
            python 01-botbhai/botbhai/leadfinder/enrich.py "$f" --out "${f%.csv}-enriched.csv" --max 300 || true
          done
      - uses: actions/upload-artifact@v4
        with: { name: leads, path: 01-botbhai/botbhai/leads/, retention-days: 7 }
