# A146: push our n8n workflows (00-hq/n8n-selfhost/workflows) and credentials (from GitHub secrets) to the self-hosted n8n.
name: n8n-sync
on:
  workflow_dispatch:
    inputs:
      create_credentials: { description: "create n8n credentials from GitHub secrets (yes/no)", default: "no" }
  push:
    branches: [main]
    paths: ["00-hq/n8n-selfhost/workflows/**", "00-hq/n8n-selfhost/sync.py"]
permissions:
  contents: read
concurrency: { group: n8n-sync, cancel-in-progress: false }   # two runs at once made duplicate credentials (4 Nov)
jobs:
  sync:
    if: ${{ vars.N8N_SELF_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Wake n8n and wait until its API is ready (free Render sleeps; /healthz answers before the API routes load)
        run: |
          for i in $(seq 1 24); do
            c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "${{ vars.N8N_SELF_URL }}/api/v1/workflows" || true)
            echo "try $i: api $c"; [ "$c" = "401" ] || [ "$c" = "200" ] && exit 0; sleep 10
          done; echo "n8n API not ready after 4 min"; exit 1
      - run: python3 00-hq/n8n-selfhost/sync.py
        env:
          N8N_SELF_URL: ${{ vars.N8N_SELF_URL }}
          N8N_SELF_API_KEY: ${{ secrets.N8N_SELF_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          KL_CREATE_CREDS: ${{ github.event.inputs.create_credentials || 'no' }}
