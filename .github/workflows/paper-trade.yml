# b7 Track A paper bot (Akhil 13 Nov 2026: "trading track nifty etf bot", rules "Up to 100%", C66).
# Weekdays 16:15 IST after NSE close: signal from the Nifty 50 index, simulated fill at the next
# NIFTYBEES open, idle cash earns the liquid-ETF rate. PAPER ONLY: no broker, no keys, no secrets.
# Stop new buys from the phone: add an empty file 07-trading/paper/track-A/flags/KILL and push
# (the bot keeps what it holds; selling everything is a separate --flatten run).
# Starts the 90-day paper clock (PLAN.md Q7.10). Holidays: same bar again = no action, no row.
name: Paper trading (Track A, Nifty ETF)
on:
  schedule:
    - cron: "45 10 * * 1-5"      # 16:15 IST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paper-trade
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # yfinance runs here; the push token is added only in the save step
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install pinned research packages
        run: pip install numpy==2.5.4 pandas==3.0.6 pyarrow==26.0.0 yfinance==1.7.0
      - name: Paper decision for today's close
        working-directory: 07-trading
        run: |
          python -m src.livetrade.runner --track A --mode paper --strategy tsmom --signal-symbol ^NSEI \
            --capital 5000 --out paper/track-A --flags paper/track-A/flags | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Gold leg of the Rs 10,000 plan (A163, buy once and hold; same KILL switch)
        working-directory: 07-trading
        run: |
          python -m src.livetrade.runner --track A --mode paper --strategy hold --symbol GOLDBEES \
            --capital 5000 --out paper/track-A-gold --flags paper/track-A/flags | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 5-min bar history (Yahoo keeps 60 days; we keep our own, never in git)
        uses: actions/cache@v4
        with:
          path: 07-trading/data/intraday
          key: intraday-5m-${{ github.run_id }}
          restore-keys: intraday-5m-
      - name: 5-min intraday paper bot (Akhil 13 Nov; strategies rejected on data, paper only)
        working-directory: 07-trading
        continue-on-error: true
        run: |
          python -m src.intraday --symbol NIFTYBEES.NS --capital 5000 \
            --store data/intraday/NIFTYBEES_5m.parquet --paper paper/intraday | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Stocks-in-Play 5-min ORB on Nifty 50 stocks (paper; rejected on data)
        working-directory: 07-trading
        continue-on-error: true
        run: python -m src.stocks_in_play --paper paper/stocks-in-play --capital 5000 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Hugging Face model cache (Kronos weights, pinned revisions)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kronos-small-901c26c1-tok-0e011738
      - name: Kronos daily signal (paper; Akhil approved running Kronos 13 Nov 2026)
        working-directory: 07-trading
        continue-on-error: true
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
          pip install einops==0.8.1 huggingface_hub==0.33.1 safetensors==0.6.2 tqdm==4.67.1
          python -m src.kronos_paper --out paper/kronos --capital 5000 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: World Check (alerts only; a failure never blocks the paper run)
        working-directory: 07-trading
        continue-on-error: true
        run: python -m src.worldcheck --out paper/track-A/worldcheck.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save paper ledgers (paper/ only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git config user.name "kalpa-paper-bot"
          git config user.email "84580207+Akhilkanigicharla@users.noreply.github.com"
          git add 07-trading/paper/track-A 07-trading/paper/track-A-gold 07-trading/paper/intraday 07-trading/paper/stocks-in-play 07-trading/paper/kronos
          git diff --cached --quiet && exit 0
          git commit -q -m "b7 paper: Track A $(TZ=Asia/Kolkata date +%F)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep $((RANDOM % 10 + 3)); done; exit 1
