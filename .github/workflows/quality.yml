# Company-wide quality gate (free on GitHub Actions). Deep Scan v2, area 8.
# secrets (gitleaks) + workflow lint (actionlint) + every world's tests.
name: Kalpa quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hygiene:
    runs-on: ubuntu-24.04  # pinned 13 Nov 2026: ubuntu-latest is 26.04, Playwright 1.56 has no Chromium for it
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - name: Install gitleaks + actionlint (pinned Go modules)
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Secrets scan (whole history)
        run: gitleaks git --redact --verbose --no-banner --exit-code 1 .  # --verbose prints the fingerprint (secret stays redacted) for .gitleaksignore
      - name: Secrets scan 2 (TruffleHog, new commits only)
        if: ${{ !cancelled() }}  # runs even when gitleaks already failed, so both scanners report
        # A205. TruffleHog is AGPL-3.0: run unmodified as a CI tool, never copied into a product (CLAUDE.md rule 3).
        # Release v3.99.9 checked 2026-11-13 on github.com/trufflesecurity/trufflehog/releases; sha256 from its checksums.txt.
        # --no-verification: candidate secrets are never sent to any provider. gitleaks above covers the whole history.
        env:
          TH_VER: "3.99.9"
          TH_SHA: "12050095c8063bf4d34f9f6cbce6ba9fa8d0deea9d503d0570364feba093658e"
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          curl -sSfL --retry 3 --max-time 60 -o /tmp/th.tgz \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TH_VER}/trufflehog_${TH_VER}_linux_amd64.tar.gz"
          echo "${TH_SHA}  /tmp/th.tgz" | sha256sum -c -
          tar -xzf /tmp/th.tgz -C /tmp trufflehog
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then BASE=$(git rev-parse HEAD~1); fi
          echo "Scanning commits after $BASE"
          /tmp/trufflehog git file://. --since-commit "$BASE" --branch HEAD --no-verification --fail --no-update
      - name: Lint workflows
        run: actionlint -color

  engineering:
    # Kalpa engineering standard (00-hq/design/ENGINEERING-CHECKS.md, 107 items): headers, CSP, clickjacking, 404,
    # secrets, XSS sinks, rate limits, timeouts, input caps, budgets, across every world. FAIL blocks; WARN is listed.
    runs-on: ubuntu-24.04  # pinned 13 Nov 2026: ubuntu-latest is 26.04, Playwright 1.56 has no Chromium for it
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Build the Deals site (the check reads its built pages)
        run: cd 05-deals/site && npm ci && npm run build
      - name: Build the Ledger Peaks site (A192, stdlib only)
        run: python3 06-finops/site/build.py
      - name: Engineering checks, all worlds
        run: python3 00-hq/tools/eng_check.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Openverse image helper tests (A209, offline)
        run: python3 00-hq/tools/test_openverse_images.py

  design:
    # 20 "vibecoded" tells (gradients, glass, emoji headings, scroll fades, em dashes, off-scale spacing …) across every site
    runs-on: ubuntu-24.04  # pinned 13 Nov 2026: ubuntu-latest is 26.04, Playwright 1.56 has no Chromium for it
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node 00-hq/design/vibecheck.test.mjs
      - run: node 00-hq/design/theme.test.mjs
      - run: node 00-hq/agents/tooling.test.mjs
      - run: node 00-hq/mods/smoke.test.mjs
      - run: python3 00-hq/agents/test_council.py && python3 00-hq/agents/test_live_status.py

  site-taps:
    # Every customer tap on the Kalpa Labs site at 390 px, light + dark: nothing covered,
    # no field off-screen, tap targets >= 44 px, chat buttons open the typing box.
    runs-on: ubuntu-24.04  # pinned 13 Nov 2026: ubuntu-latest is 26.04, Playwright 1.56 has no Chromium for it
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright==1.56.0 && python -m playwright install --with-deps chromium
      - run: python 00-hq/site/tests/test_tap_sweep.py
      - run: python 00-hq/site/tests/test_seo.py
      - run: python 00-hq/site/tests/test_form_ux.py
      - run: python 00-hq/site/tests/test_chat_button.py

  botbhai:
    runs-on: ubuntu-24.04  # pinned 13 Nov 2026: ubuntu-latest is 26.04, Playwright 1.56 has no Chromium for it
    timeout-minutes: 15
    # Postgres runs the schema test (supabase/test.sh); Playwright + OpenCV + poppler run the 390 px screens,
    # the inbox and billing click-throughs, the QR scan and the invoice PDF check. Versions are the ones proven locally.
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils postgresql-client ffmpeg
      - run: pip install openpyxl==3.1.5 pillow==12.3.0 playwright==1.56.0 opencv-python-headless==5.0.0.93 numpy==2.5.4
      - run: python -m playwright install --with-deps chromium
      - run: bash 01-botbhai/botbhai/tools/test-all.sh

  python-worlds:
    runs-on: ubuntu-24.04  # pinned 13 Nov 2026: ubuntu-latest is 26.04, Playwright 1.56 has no Chromium for it
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: b7 Trading Lab
        working-directory: 07-trading
        run: |
          pip install numpy==2.5.4 pandas==3.0.6 pyarrow==26.0.0 pytest==9.1.1 scikit-learn==1.9.1
          python -m pytest -q
      - name: b6 Ledger Peaks
        working-directory: 06-finops
        run: |
          pip install genai-prices==0.1.11 pytest==9.1.1 playwright==1.56.0
          python -m playwright install --with-deps chromium
          python -m pytest -q -rs tests/
      - name: b5 Deal Poster Bot (A18, stdlib only)
        working-directory: 05-deals/site/src/bot
        run: python -m unittest -v test_post.py test_channel.py test_verdict.py

  kits:
    runs-on: ubuntu-24.04  # pinned 13 Nov 2026: ubuntu-latest is 26.04, Playwright 1.56 has no Chromium for it
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libreoffice-calc-nogui
      - run: pip install openpyxl==3.1.5
      - name: Tax + SIP kit recalculated in LibreOffice vs the site's tax engine
        run: python 03-kits/tax-sip/test_kit.py
      - name: GATE 2027 kit (Lite/Kit/Pro) recalculated in LibreOffice
        run: python 03-kits/gate-2027/test_kit.py
      - name: 20 exam kits (data, links format, new sheets) recalculated in LibreOffice
        run: python 03-kits/exam-kits/test_build.py
      - name: Kit link checker (offline tests)
        run: python 03-kits/exam-kits/test_check_links.py
      - name: Explainer clip data + checks (A201, video tests skip without ffmpeg)
        working-directory: 03-kits/explainers
        run: python test_clips.py

  jobcard:
    runs-on: ubuntu-24.04  # pinned 13 Nov 2026: ubuntu-latest is 26.04, Playwright 1.56 has no Chromium for it
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - name: Core tests
        working-directory: 02-jobcard
        run: npm ci && npm test
      - name: Expo app, tsc + Jest (A36)
        working-directory: 02-jobcard/src
        run: corepack enable && pnpm install --frozen-lockfile && pnpm type-check && CI=1 pnpm test
      - name: Schema + RLS tests
        env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }
        run: bash 02-jobcard/supabase/test.sh
      - name: b6 Ledger Peaks schema + RLS (A28)
        env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }
        run: bash 06-finops/src/db/test.sh
      - name: App screens at 390 px, light + dark (A13)
        run: |
          pip install playwright==1.56.0 pillow==12.3.0   # check.py reads icon sizes with PIL (A55)
          python -m playwright install --with-deps chromium
          python3 02-jobcard/design/screens.py
      - name: My-customers PWA at 390 px, offline, installable (A37)
        run: node 02-jobcard/web/build.mjs && python3 02-jobcard/web/check.py && python3 02-jobcard/web/ux.py

  tab-lifeboat:
    runs-on: ubuntu-24.04  # pinned 13 Nov 2026: ubuntu-latest is 26.04, Playwright 1.56 has no Chromium for it
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 04-extensions/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run compile
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: node tests/e2e/screens.e2e.mjs   # popup + options, light + dark, backup file round trip (A13)
      - run: pip install pillow==12.3.0           # store.e2e reads image sizes with PIL (A55)
      - run: node tests/e2e/store.e2e.mjs     # store images from the real extension, sizes checked (A40)
      - run: node tests/e2e/site.e2e.mjs      # policy/landing site at 390 + 1280 px, light + dark (A40)
