# A227/A61: smoke test every live URL (00-hq/launch/smoke-targets.json) every 6 h and after a manual run,
# then commit 00-hq/launch/smoke-results.json so 00-hq/launch/check.py (launch board) sees fresh results.
# Read-only GETs + one chat POST per run; never deploys.
name: smoke
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "one target name (empty = all)"
        required: false
permissions:
  contents: write
concurrency:
  group: smoke
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q playwright==1.56.0 && python -m playwright install --with-deps chromium
      - run: python3 00-hq/launch/test_smoke.py
      - name: Smoke live URLs
        id: run
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          set +e
          if [ -n "$ONLY" ]; then python3 00-hq/launch/smoke.py --only "$ONLY"; else python3 00-hq/launch/smoke.py; fi
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Commit results
        run: |
          git config user.name "Akhilkanigicharla"
          git config user.email "84580207+Akhilkanigicharla@users.noreply.github.com"
          git add 00-hq/launch/smoke-results.json
          git diff --cached --quiet && exit 0
          git commit -q -m "smoke: live results $(date -u +%FT%TZ) [skip ci]"
          for _ in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep $((RANDOM % 10 + 3)); done; exit 1
      - name: Fail the run if a live URL failed
        if: steps.run.outputs.code != '0'
        run: exit 1
