# b7 Trading Lab: TradingAgents research desk (paper research only, never trades).
# Source: TauricResearch/TradingAgents (Apache-2.0), pinned to the v0.7.1 release commit.
# See 07-trading/research/tradingagents.md for the vetting notes and rules.
# Needs the free key of the chosen provider as a repo secret that Akhil sets himself (Settings → Secrets → Actions):
#   google → GEMINI_API_KEY (default since 21 Nov 2026), openrouter → OPENROUTER_API_KEY.
# OpenRouter free = ~50 requests/day shared with the n8n agents (it ran out on 21 Nov), so Gemini is the default.
name: b7 TradingAgents research (manual)

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Yahoo ticker. Year-1 plan = NSE/BSE cash only, e.g. RELIANCE.NS, TCS.NS, NIFTYBEES.NS"
        required: true
        default: "NIFTYBEES.NS"
      date:
        description: "Analysis date YYYY-MM-DD (blank = today, IST)"
        required: false
        default: ""
      analysts:
        description: "market,news,fundamentals,sentiment (fewer = fewer model calls)"
        required: false
        default: "market,news,fundamentals"
      provider:
        description: "Free model provider: google (Gemini key) or openrouter"
        required: false
        default: "google"
        type: choice
        options: [google, openrouter]

permissions:
  contents: read

concurrency:
  group: tradingagents
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TRADINGAGENTS_LLM_PROVIDER: ${{ inputs.provider || 'google' }}
      # google: 3.5 Flash-Lite for every agent. Tried 21 Nov 2026: 2.5 Flash is closed to new users (404), 3.8 Flash
      # answered "high demand" (503) on the free key. openrouter: the free Nemotron pair used before.
      TRADINGAGENTS_QUICK_THINK_LLM: ${{ (inputs.provider || 'google') == 'google' && 'gemini-3.5-flash-lite' || 'nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free' }}
      TRADINGAGENTS_DEEP_THINK_LLM: ${{ (inputs.provider || 'google') == 'google' && 'gemini-3.5-flash-lite' || 'nvidia/nemotron-3-super-120b-a12b:free' }}
      TRADINGAGENTS_OUTPUT_LANGUAGE: English
      TRADINGAGENTS_MAX_DEBATE_ROUNDS: "1"
      TRADINGAGENTS_MAX_RISK_ROUNDS: "1"
      TRADINGAGENTS_LLM_MAX_RETRIES: "6"
      TRADINGAGENTS_BENCHMARK_TICKER: "^NSEI"
      TRADINGAGENTS_NO_UPDATE_CHECK: "1"
      TRADINGAGENTS_RESULTS_DIR: ${{ github.workspace }}/ta-out/reports
      TRADINGAGENTS_CACHE_DIR: ${{ github.workspace }}/ta-out/cache
      TRADINGAGENTS_MEMORY_LOG_PATH: ${{ github.workspace }}/ta-out/memory.md
      SEC_EDGAR_USER_AGENT: "Kalpa Labs research 84580207+Akhilkanigicharla@users.noreply.github.com"
    steps:
      - name: Check the secret is set
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "$TRADINGAGENTS_LLM_PROVIDER" = google ]; then need=GEMINI_API_KEY; have="$GOOGLE_API_KEY"; else need=OPENROUTER_API_KEY; have="$OPENROUTER_API_KEY"; fi
          if [ -z "$have" ]; then
            echo "::error::Add the $need repo secret first (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Check the ticker is allowed by the year-1 plan
        env:
          TICKER: ${{ inputs.ticker }}
        run: |
          case "$TICKER" in
            *.NS|*.BO|^NSEI) echo "OK: $TICKER" ;;
            *) echo "::error::$TICKER is outside the year-1 plan (NSE/BSE cash only, see 07-trading/PLAN.md §2a)."; exit 1 ;;
          esac

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install TradingAgents v0.7.1 (pinned commit; 0.7.1 fixes a look-ahead leak, #1488)
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/TauricResearch/TradingAgents@c4544913a14ed3df5f1ed7b9e8483270ce20682a"

      - name: Run the research desk
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TICKER: ${{ inputs.ticker }}
          ANALYSTS: ${{ inputs.analysts }}
          RUN_DATE: ${{ inputs.date }}
        run: |
          set -o pipefail   # without this, tee hid a failed run as "success" (21 Nov 2026)
          mkdir -p ta-out
          D="${RUN_DATE:-$(TZ=Asia/Kolkata date +%F)}"
          tradingagents --ticker "$TICKER" --date "$D" --analysts "$ANALYSTS" --save --no-show 2>&1 | tee ta-out/run.log

      - name: Add the research-only notice
        if: always()
        run: |
          mkdir -p ta-out
          printf '%s\n' "RESEARCH ONLY. Not investment advice. Paper trading only (SEBI). LLM output varies run to run." \
            "A rating here is an input to Quant's bull-bear desk and Guard's review, then the lab gate (walk-forward, costs, PBO)." > ta-out/README.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tradingagents-${{ inputs.ticker }}-${{ github.run_id }}
          path: ta-out/
          if-no-files-found: warn
          retention-days: 30
