<meta charset="utf-8">
<title>Kalpavruksha CEO Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Anek+Latin:wght@400;500;600;700&family=Anek+Telugu:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: Kalpavruksha CEO room. HQ is the trunk, the 7 worlds are branches: leaf green, bark brown, fruit gold on parchment,
   seed-dot ground, vine bands on the hero cards. Phone first: Today answers "what do I do now?",
   the other views sit behind a bottom tab bar on phones and a top bar on desktop. */
:root{
  --bg:#F2EEE3; --panel:#FCFAF4; --fg:#1E2A1F; --muted:#5A6152; --rule:#DCD5C3; --soft:#E9E3D3;
  --accent:#2F6A3A; --accent-fg:#FFFFFF; --madder:#8A4A28; --gold:#C38E12; --flame:#B35E26;
  --ok:#2C7A43; --warn:#A06400; --bad:#B13A2D;
  --hero:#1D3A25; --hero-fg:#F4EEDC; --hero-mute:#BFCDAE;
  --leaf:#5E9E4C; --bark:#6B4226; --l0:#66655A; --l1:#8A4A28; --l2:#2F6F78; --l3:#3B7A3A; --l4:#7A3F5E; --l5:#9C700E; --l6:#A8324F; --l7:#4A5590;
  --f-display:"Rozha One","Noto Serif",Georgia,serif;
  --f-body:"Anek Latin","Anek Telugu",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-s:8px; --r-m:12px; --r-l:18px;
  --shadow:0 1px 0 color-mix(in srgb,var(--fg) 6%,transparent),0 10px 24px -18px color-mix(in srgb,var(--accent) 55%,transparent);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1912; --panel:#16231A; --fg:#ECE7D8; --muted:#A8B39B; --rule:#2A3A2D; --soft:#1D2C21;
  --accent:#8FCB8C; --accent-fg:#0F1912; --madder:#D98B5F; --gold:#E8B64A; --flame:#E5925A;
  --ok:#6FD08F; --warn:#E8B64A; --bad:#F07A6B;
  --hero:#17301F; --hero-fg:#F4EEDC; --hero-mute:#BFCDAE;
  --leaf:#8FCB8C; --bark:#C08A5E; --l0:#B4B3A4; --l1:#D98B5F; --l2:#6FC2CB; --l3:#6FD08F; --l4:#D59AB9; --l5:#E8B64A; --l6:#FF7F9E; --l7:#9DA8E6;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1912; --panel:#16231A; --fg:#ECE7D8; --muted:#A8B39B; --rule:#2A3A2D; --soft:#1D2C21;
  --accent:#8FCB8C; --accent-fg:#0F1912; --madder:#D98B5F; --gold:#E8B64A; --flame:#E5925A;
  --ok:#6FD08F; --warn:#E8B64A; --bad:#F07A6B;
  --hero:#17301F; --hero-fg:#F4EEDC; --hero-mute:#BFCDAE;
  --leaf:#8FCB8C; --bark:#C08A5E; --l0:#B4B3A4; --l1:#D98B5F; --l2:#6FC2CB; --l3:#6FD08F; --l4:#D59AB9; --l5:#E8B64A; --l6:#FF7F9E; --l7:#9DA8E6;
  color-scheme:dark}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(color-mix(in srgb,var(--accent) 13%,transparent) 1px,transparent 1.4px);background-size:18px 18px;color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
/* temple border: a block-printed band of lotus dots and teeth, used on hero surfaces */

/* ===== game layer ===== */
.levelcard{position:relative;border-radius:var(--r-l);padding:22px 20px 26px;color:var(--hero-fg);background:
  radial-gradient(circle at 92% 18%,color-mix(in srgb,var(--gold) 22%,transparent) 0 70px,transparent 71px),
  radial-gradient(circle at 92% 18%,transparent 0 84px,color-mix(in srgb,var(--gold) 30%,transparent) 85px 86px,transparent 87px),
  var(--hero);display:grid;gap:14px;overflow:hidden;box-shadow:0 18px 40px -22px #1D3A25}
.levelcard::before,.levelcard::after{content:"";position:absolute;left:0;right:0;height:10px;background:
  radial-gradient(circle at 7px 5px,var(--gold) 2.4px,transparent 2.8px) 0 0/14px 10px,
  radial-gradient(ellipse 3.2px 2px at 3.5px 5px,var(--leaf,#5E9E4C) 90%,transparent) 0 0/7px 10px}
.levelcard::before{top:0;opacity:.9}
.levelcard::after{bottom:0;transform:scaleY(-1);opacity:.9}
.levelcard .lvl{font:400 clamp(34px,8vw,46px)/1 var(--f-display);color:var(--gold);letter-spacing:.005em;margin-top:4px}
.levelcard .sub{color:var(--hero-mute);font-size:14.5px}
.levelcard .sub b{color:var(--hero-fg)}
.xpbar{height:12px;border-radius:999px;background:color-mix(in srgb,var(--hero-fg) 16%,transparent);overflow:hidden;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--hero-fg) 18%,transparent)}
.xpbar i{display:block;height:100%;border-radius:999px;background:repeating-linear-gradient(135deg,var(--gold) 0 8px,color-mix(in srgb,var(--gold) 78%,#fff) 8px 12px);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--hero-fg) 10%,transparent);border:1px solid color-mix(in srgb,var(--hero-fg) 22%,transparent);border-radius:999px;padding:5px 12px;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;color:var(--hero-fg)}

.quest{border-radius:var(--r-l);padding:22px 18px 18px;background:var(--panel);display:grid;gap:12px;position:relative;overflow:hidden;box-shadow:var(--shadow),inset 0 0 0 1px color-mix(in srgb,var(--qc) 35%,var(--rule))}
.quest::before{content:"";position:absolute;inset:0 0 auto 0;height:9px;background:
  linear-gradient(135deg,var(--panel) 0 25%,transparent 25% 75%,var(--panel) 75%) 0 0/12px 12px,var(--qc)}
.quest h2{font-size:clamp(24px,5.4vw,30px);line-height:1.12}
.xpchip{display:inline-flex;align-items:center;gap:5px;font:600 13px var(--f-body);font-variant-numeric:tabular-nums;padding:2px 10px;border-radius:999px;background:color-mix(in srgb,var(--gold) 20%,var(--panel));color:var(--fg);border:1px solid color-mix(in srgb,var(--gold) 60%,transparent)}
.boss{background:color-mix(in srgb,var(--bad) 14%,var(--panel));border-color:color-mix(in srgb,var(--bad) 55%,transparent)}

.worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:10px}
.world{border:0;border-radius:var(--r-m);padding:14px 12px 12px;text-align:left;cursor:pointer;background:var(--panel);box-shadow:inset 0 0 0 1px var(--rule);display:grid;gap:6px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.world::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--wc)}
.world:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1.5px var(--wc),0 12px 22px -16px var(--wc)}
.world .wname{font:400 18px/1.15 var(--f-display)}
.world .wmeta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.world .bar{background:color-mix(in srgb,var(--wc) 14%,var(--soft))}

.badges{display:flex;flex-wrap:wrap;gap:12px}
.badge{display:grid;justify-items:center;gap:6px;width:80px;text-align:center;font-size:12px;line-height:1.25;font-weight:500}
.badge .b{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:radial-gradient(circle,color-mix(in srgb,var(--gold) 30%,var(--panel)) 0 60%,transparent 61%),conic-gradient(from 0deg,var(--gold) 0 12.5%,var(--madder) 0 25%,var(--gold) 0 37.5%,var(--madder) 0 50%,var(--gold) 0 62.5%,var(--madder) 0 75%,var(--gold) 0 87.5%,var(--madder) 0);box-shadow:0 6px 14px -8px var(--madder)}
.badge.locked .b{background:var(--soft);box-shadow:inset 0 0 0 1.5px dashed var(--rule);filter:grayscale(1);opacity:.55}
.badge.locked{color:var(--muted)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.kingdom{width:100%;max-width:580px;margin:0 auto;display:block}
.isle{cursor:pointer}
.isle:focus-visible circle.edge{stroke-width:5}
.lore{border-radius:var(--r-l);padding:18px;display:grid;gap:12px;background:linear-gradient(160deg,color-mix(in srgb,var(--wc) 16%,var(--panel)),var(--panel) 70%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--wc) 40%,var(--rule))}
.npc{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:start}
.npc .face{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:var(--panel);box-shadow:0 0 0 2px var(--wc),0 0 0 6px color-mix(in srgb,var(--wc) 18%,transparent)}
.speech{background:var(--panel);border-radius:4px var(--r-m) var(--r-m) var(--r-m);padding:10px 12px;box-shadow:inset 0 0 0 1px var(--rule)}
.speech b{font-family:var(--f-display);font-weight:400;font-size:1.05em}
.wlevel{display:inline-flex;align-items:center;gap:6px;font:600 13px var(--f-body);padding:3px 11px;border-radius:999px;background:var(--wc);color:#fff}
.chapter{display:flex;align-items:center;gap:10px;margin-top:10px}
.chapter .num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:400 17px var(--f-display);background:var(--wc);color:#fff;flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--wc) 22%,transparent)}
.chapter h3{font-size:19px}
.bounty{display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:var(--r-m);padding:12px 14px;background:color-mix(in srgb,var(--gold) 14%,var(--panel));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 50%,transparent);font-size:15px}
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:color-mix(in srgb,#0F1912 62%,transparent);padding:16px}
.overlay[hidden]{display:none}
.overlay .box{position:relative;max-width:360px;width:100%;border-radius:var(--r-l);padding:30px 24px 26px;text-align:center;color:var(--hero-fg);background:var(--hero);display:grid;gap:10px;overflow:hidden;box-shadow:0 30px 60px -20px #000}
.overlay .box::before{content:"";position:absolute;inset:0 0 auto 0;height:10px;background:radial-gradient(circle at 7px 5px,var(--gold) 2.4px,transparent 2.8px) 0 0/14px 10px,radial-gradient(ellipse 3.2px 2px at 3.5px 5px,var(--leaf,#5E9E4C) 90%,transparent) 0 0/7px 10px}
.overlay .big{font:400 42px/1 var(--f-display);color:var(--gold)}
.overlay .emo{font-size:54px}
.overlay .eyebrow{color:var(--hero-mute)!important}
.overlay .btn{background:var(--gold)!important;color:#1D3A25!important;border:0!important}

/* ===== forge (agents' builds) ===== */
.forge{display:grid;gap:3px;font:500 11.5px var(--f-mono);color:var(--muted)}
.fbar{height:5px;border-radius:999px;background:var(--soft);overflow:hidden}
.fbar i{display:block;height:100%;border-radius:999px;background:repeating-linear-gradient(135deg,var(--gold) 0 5px,color-mix(in srgb,var(--gold) 65%,var(--panel)) 5px 8px)}
.flist{display:grid;gap:6px}
.frow{display:grid;grid-template-columns:10px minmax(0,1fr);column-gap:10px;row-gap:2px;align-items:center;text-align:left;border:0;background:var(--soft);border-radius:var(--r-m);padding:9px 12px;cursor:pointer;width:100%}
.frow:hover{box-shadow:inset 0 0 0 1.5px var(--wc)}
.frow .ft{font-weight:600;min-width:0}
.frow .fm{grid-column:2;font-size:12px;color:var(--muted)}
.coop{background:color-mix(in srgb,var(--gold) 10%,var(--panel));border-radius:var(--r-s);padding:8px 10px}
.builtpanel>summary{cursor:pointer;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.blist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.blist li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start}
.blist li:not(.done){color:var(--muted)}

/* ===== base ===== */
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:16px 108px;display:grid;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.003em}
h1{font-size:clamp(24px,4.6vw,30px);line-height:1}
h2{font-size:23px;line-height:1.15}
h3{font-size:19px;line-height:1.25}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.small{font-size:14px}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--gold) 40%,transparent)}

/* top bar */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--gold) 16%,var(--panel));color:var(--gold);display:grid;place-items:center;font:600 22px/1 "Anek Telugu",var(--f-body);box-shadow:0 0 0 2px var(--gold),0 0 0 5px color-mix(in srgb,var(--gold) 25%,transparent)}
.live{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-top:4px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
nav.tabs{display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--rule)}
nav.tabs button{border:0;background:none;padding:8px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;font-size:14.5px}
nav.tabs button:hover{color:var(--fg)}
nav.tabs button[aria-current="page"]{background:var(--hero);color:var(--hero-fg)}
nav.tabs button[aria-current="page"] svg{color:var(--gold)}
nav.tabs svg{width:18px;height:18px}
@media (max-width:760px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;border-radius:18px 18px 0 0;background:var(--panel);box-shadow:0 -1px 0 var(--rule),0 -12px 30px -20px color-mix(in srgb,var(--accent) 60%,transparent);justify-content:space-around;padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
  nav.tabs button{flex-direction:column;gap:2px;font-size:11.5px;padding:7px 2px;flex:1;border-radius:12px}
}
@media (min-width:761px){.wrap{padding-block:24px 56px}}

.panel{background:var(--panel);border-radius:var(--r-l);padding:18px;min-width:0;box-shadow:var(--shadow),inset 0 0 0 1px var(--rule)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.stack{display:grid;gap:12px}

/* home hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:92px;height:92px}
.ring text{font-family:var(--f-display)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat b{display:block;font:400 24px var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.next{border-radius:var(--r-l);padding:18px;background:var(--panel);display:grid;gap:10px;box-shadow:inset 0 0 0 2px var(--accent)}
.next h2{font-size:24px}
.youdo{background:color-mix(in srgb,var(--accent) 8%,var(--panel));border-radius:var(--r-m);padding:12px 14px;display:grid;gap:4px;box-shadow:inset 3px 0 0 var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap;background:var(--panel)}
.chip.doing{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,var(--rule))}
.chip.done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,var(--rule))}
.chip.gate{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--rule))}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--rule);background:var(--panel);padding:10px 18px;border-radius:999px;cursor:pointer;font-weight:600;min-height:46px;transition:transform .12s,background .15s,box-shadow .15s}
.btn:hover{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 45%,transparent)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13.5px}

/* routine */
.steps{display:grid;gap:10px}
.step{display:grid;grid-template-columns:58px 1fr;gap:10px}
.step .t{font-family:var(--f-mono);font-size:12.5px;color:var(--madder);padding-top:2px;font-weight:600}

/* leaderboard */
.lb{display:grid;gap:8px}
.lbrow{display:grid;grid-template-columns:22px 1fr 44px;gap:10px;align-items:center;border:0;background:none;padding:7px 6px;border-radius:var(--r-s);cursor:pointer;text-align:left;width:100%}
.lbrow:hover{background:var(--soft)}
.bar{height:7px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:4px}

/* unit chips */
.unitbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.unitbar button{flex:none;border:0;background:var(--panel);box-shadow:inset 0 0 0 1px var(--rule);border-radius:999px;padding:8px 14px;cursor:pointer;display:flex;align-items:center;gap:7px;font-weight:600;font-size:14px}
.unitbar button[aria-pressed="true"]{background:var(--hero);color:var(--hero-fg);box-shadow:none}

/* task cards */
details.task{border-radius:var(--r-m);background:var(--panel);overflow:hidden;box-shadow:inset 0 0 0 1px var(--rule)}
details.task[open]{box-shadow:inset 0 0 0 1.5px var(--accent),var(--shadow)}
details.task summary{list-style:none;cursor:pointer;padding:13px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
details.task summary::-webkit-details-marker{display:none}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--rule);display:grid;place-items:center}
.tick.doing{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 22%,transparent)}
.tick.done{border-color:var(--ok);background:var(--ok)}
.tick.done::after{content:"";width:9px;height:5px;border-left:2px solid var(--panel);border-bottom:2px solid var(--panel);transform:rotate(-45deg) translate(1px,-1px)}
.tbody{padding:0 14px 16px 50px;display:grid;gap:10px}
.kv{display:grid;gap:8px}
.kv div{display:grid;gap:2px}
.kv dt{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kv dd{margin:0}
.seg{display:inline-flex;border-radius:999px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--rule);background:var(--panel)}
.seg button{border:0;background:none;padding:8px 14px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted);min-height:42px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.phasehead{display:flex;align-items:baseline;gap:10px;margin-top:6px}

/* map */
.mapbox{overflow-x:auto;border-top:1px solid var(--rule);margin-top:10px;padding-top:6px}
svg text{font-family:var(--f-mono)}
.st{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted)}

/* agent org */
.orggroup{border-radius:var(--r-m);padding:10px 12px;box-shadow:inset 0 0 0 1px var(--rule);background:var(--panel)}
.orggroup>summary,.orgagent>summary{cursor:pointer;list-style-position:outside}
.orgagent{padding:4px 0;border-top:1px dashed var(--rule)}
.chips .chip.on{outline:2px solid currentColor}
/* agents feed */
.feed{display:grid;gap:12px}
.msg{display:grid;grid-template-columns:36px 1fr;gap:10px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--f-mono);color:var(--gold);background:var(--hero);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 45%,transparent)}
.bubble{background:var(--soft);border-radius:4px 14px 14px 14px;padding:10px 12px;display:grid;gap:4px;min-width:0}
.bubble .who{font-size:12.5px;color:var(--muted)}
.deptgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}

  let level=1;for(let i=0;i<LV.length;i++)if(xp>=LV[i])level=i+1;
  const cur=LV[level-1],nxt=LV[level]??null;
  const days=new Set(Object.keys(statusAt).filter(id=>status[id]&&status[id]!=="todo").map(id=>istDay(statusAt[id])).filter(Boolean));
  // Streak with a rest day: one missed day in any 7 keeps the streak alive (Duolingo-style freeze;
  // see 00-hq/research/kingdom-gamification.md). Today not done yet never breaks it.
  let streak=0,rests=0,lastRest=null,firstRest=null;const d=new Date(Date.now()+5.5*3600e3);
  const key=()=>d.toISOString().slice(0,10);
  if(!days.has(key()))d.setUTCDate(d.getUTCDate()-1);
  for(let guard=0;guard<400;guard++){
    if(days.has(key())){streak++;d.setUTCDate(d.getUTCDate()-1);continue;}
    const prev=new Date(d);prev.setUTCDate(prev.getUTCDate()-1);
    const canRest=streak>0&&days.has(prev.toISOString().slice(0,10))&&(lastRest===null||streak-lastRest>=6);
    if(!canRest)break;
    rests++;if(firstRest===null)firstRest=streak;lastRest=streak;d.setUTCDate(d.getUTCDate()-1);
  }
  const restUsedThisWeek=firstRest!==null&&firstRest<7;
  const worldsStarted=new Set(TASKS.filter(t=>stateOf(t.id)!=="todo").map(t=>t.u)).size;
  return {rests,restUsedThisWeek,bountyToday:bountyDays.has(todayIST),xp,level,title:TITLES[level-1],nextTitle:nxt!=null?TITLES[level]:"",into:xp-cur,need:nxt!=null?nxt-cur:0,streak,done:doneT.length,

}

function confetti(){
  try{if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;}catch(e){}
  const c=document.getElementById("confetti");if(!c||!c.getContext)return;const x=c.getContext("2d");if(!x)return;
  c.width=innerWidth;c.height=innerHeight;
  const cols=["#8A4A28","#2F6F78","#3B7A3A","#7A3F5E","#C38E12","#A8324F","#4A5590","#E8B64A"];
  const P=Array.from({length:140},()=>({x:c.width/2,y:c.height*0.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,s:Math.random()*7+4,r:Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)]}));

}

// ---------- Agent feed ----------
function initials(n){return String(n||"?").replace(/agent/i,"").trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();}
function feedItems(){
  const items=[];
  reports.forEach(r=>{
    const d=r.data||{};
    (d.handoffs||[]).forEach(h=>items.push({date:r.id,from:h.from,to:h.to,msg:h.msg,task:h.task}));
    (d.agent_log||[]).forEach(a=>items.push({date:r.id,from:a.agent,to:"CEO",msg:(a.unit?a.unit+": ":"")+a.did,status:a.status}));
    if(d.ceo_note) items.push({date:r.id,from:"Chief of Staff",to:"CEO",msg:d.ceo_note});
  });
  return items;
}
function feedHtml(limit){
  const it=feedItems().slice(0,limit||999);
  if(!it.length) return `<div class="empty">No messages yet. Each morning at 7:47 AM the agents post here: what they prepared, what the Validator found, and what they need from you.</div>`;
  return `<div class="feed">${it.map(m=>`<div class="msg"><div class="av" aria-hidden="true">${esc(initials(m.from))}</div><div class="bubble"><span class="who"><b>${esc(m.from)}</b> → ${esc(m.to||"Team")} · ${esc(m.date)}${m.status?` · <span class="chip ${m.status==="validated"?"done":m.status==="blocked"?"gate":"doing"}">${esc(m.status)}</span>`:""}</span><span>${esc(m.msg)}</span>${m.task&&TASKS.find(t=>t.id===m.task)?`<button class="btn sm ghost" style="justify-self:start" data-open="${esc(m.task)}">Open task</button>`:""}</div></div>`).join("")}</div>`;
}

// ---------- Map ----------
function viewMap(){
  const g=game();
  // The Kalpavruksha: HQ is the trunk, each world a branch. Leaves = quests done, gold fruit = 50%+ done, ring = progress.
  const BR={b1:[300,58,214],b2:[292,302,204],b3:[262,40,128],b4:[252,320,120],b5:[234,98,66],b6:[228,262,62],b7:[220,180,38]};
  const along=(x0,y0,cx1,cy1,x1,y1,t)=>({x:(1-t)*(1-t)*x0+2*(1-t)*t*cx1+t*t*x1,y:(1-t)*(1-t)*y0+2*(1-t)*t*cy1+t*t*y1});
  let s=`<rect x="0" y="0" width="360" height="400" rx="24" fill="color-mix(in srgb,var(--leaf) 7%,var(--panel))"/>`;
  s+=`<path d="M40 376 Q180 356 320 376" fill="none" stroke="var(--bark)" stroke-width="3" stroke-linecap="round" opacity=".55"/>`;
  s+=`<path class="grow" d="M150 380 Q166 368 174 352 M210 380 Q194 368 186 352" fill="none" stroke="var(--bark)" stroke-width="4" stroke-linecap="round"/>`;
  s+=`<path class="grow" d="M171 372 C174 320 172 270 176 218 L184 218 C188 270 186 320 189 372 Z" fill="var(--bark)"/>`;
  let i=0;
  UNITS.filter(u=>u.id!=="hq").forEach(u=>{
    const [by,ex,ey]=BR[u.id],x0=180,cx1=(x0+ex)/2,cy1=Math.min(by,ey)-8,pct=unitPct(u.id),started=TASKS.some(t=>t.u===u.id&&stateOf(t.id)!=="todo");
    const r=27,c=2*Math.PI*(r+5),off=c*(1-pct/100),d=(i++)*.12;
    s+=`<g class="isle" tabindex="0" role="button" data-unit="${u.id}" data-go="units" aria-label="${esc(LORE[u.id].place)}, ${pct}% grown, ${wlevel(pct)}" style="--d:${d}s">
      <path class="${started?"grow":""}" d="M${x0} ${by} Q${cx1} ${cy1} ${ex} ${ey}" fill="none" stroke="var(--bark)" stroke-width="${started?7:4}" stroke-linecap="round" stroke-dasharray="${started?"":"5 7"}" opacity="${started?1:.55}"/>`;
    const leaves=started?1+Math.floor(pct/15):0;
    for(let k=0;k<leaves;k++){const q=along(x0,by,cx1,cy1,ex,ey,.25+.5*(k+1)/(leaves+1)),side=k%2?1:-1;
      s+=`<ellipse class="leafy" cx="${q.x.toFixed(1)}" cy="${(q.y+side*7).toFixed(1)}" rx="6.5" ry="3.6" fill="var(--leaf)" transform="rotate(${side*30} ${q.x.toFixed(1)} ${(q.y+side*7).toFixed(1)})" style="--d:${(d+.35+k*.05).toFixed(2)}s"/>`;}
    s+=`<circle cx="${ex}" cy="${ey}" r="${r}" fill="color-mix(in srgb,var(${u.color}) 22%,var(--panel))" stroke="var(${u.color})" stroke-opacity=".35"/>
      <circle cx="${ex}" cy="${ey}" r="${r+5}" fill="none" stroke="var(${u.color})" stroke-width="4" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 ${ex} ${ey})"/>
      <text x="${ex}" y="${ey-1}" text-anchor="middle" font-size="18">${WORLD_ICON[u.id]}</text>
      <text x="${ex}" y="${ey+15}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--fg)">${pct}%</text>`;
    if(pct>=50) s+=`<circle class="leafy" cx="${ex+r-4}" cy="${ey+r-6}" r="5.5" fill="var(--gold)" stroke="var(--bark)" stroke-width=".8" style="--d:${(d+.6).toFixed(2)}s"/>`;
    if(pct>=75) s+=`<circle class="leafy" cx="${ex-r+5}" cy="${ey+r-5}" r="5" fill="var(--gold)" stroke="var(--bark)" stroke-width=".8" style="--d:${(d+.7).toFixed(2)}s"/>`;
    s+=`</g>`;});
  const hp=unitPct("hq"),hr=30,hc=2*Math.PI*(hr+5);
  s+=`<g class="isle" tabindex="0" role="button" data-unit="hq" data-go="units" aria-label="${esc(LORE.hq.place)}, ${hp}% grown, ${wlevel(hp)}">
    <circle cx="180" cy="300" r="${hr}" fill="color-mix(in srgb,var(--bark) 28%,var(--panel))" stroke="var(--bark)" stroke-opacity=".5"/>
    <circle cx="180" cy="300" r="${hr+5}" fill="none" stroke="var(--gold)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${hc.toFixed(1)}" stroke-dashoffset="${(hc*(1-hp/100)).toFixed(1)}" transform="rotate(-90 180 300)"/>
    <text x="180" y="300" text-anchor="middle" font-size="20">${WORLD_ICON.hq}</text>
    <text x="180" y="316" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--fg)">${hp}%</text></g>`;
  return `<section class="panel stack"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap"><h2>The Kalpavruksha</h2><span class="muted small">Level ${g.level} ${esc(g.title)}</span></div>
  <p class="muted small">HQ is the trunk; each world is a branch. A branch turns solid when you start it, grows a leaf for every few quests done, and bears gold fruit at 50% and 75%. Tap a branch to enter it.</p>
  <svg class="kingdom" viewBox="0 0 360 400" role="img" aria-label="The Kalpavruksha: HQ trunk and the 7 world branches">${s}</svg>
  <div class="worlds">${UNITS.map(u=>`<button class="world" style="--wc:var(${u.color})" data-unit="${u.id}" data-go="units"><span class="wname">${WORLD_ICON[u.id]} ${esc(LORE[u.id].place)}</span><span class="muted" style="font-size:12px">${esc(wlevel(unitPct(u.id)))} · ${unitPct(u.id)}%</span>${forgeBar(u.id)}</button>`).join("")}</div></section>
  <details class="panel"><summary style="cursor:pointer;font-weight:600">🚇 Quest lines (detailed task map)</summary>
  <div class="legend" style="margin-top:8px"><span>○ Not started</span><span style="color:var(--warn)">● In progress</span><span style="color:var(--ok)">● Done</span><span style="color:var(--bad)">◇ Boss fight</span></div>
  <div class="mapbox"><svg id="map" role="img" aria-label="Network map of all tasks"></svg></div></details>`;
}
function drawMap(){
  const svg=document.getElementById("map");if(!svg)return;
  const rowH=54,left=92,top=42,stepX=52,bandPad=22;
  const perPhase=PHASES.map(p=>Math.max(1,...UNITS.map(u=>TASKS.filter(t=>t.u===u.id&&t.ph===p.id).length)));
  const bandX=[];let x=left;PHASES.forEach((p,i)=>{bandX.push(x);x+=perPhase[i]*stepX+bandPad*2;});
  const W=x+16,H=top+UNITS.length*rowH+12;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.setAttribute("width",W);svg.setAttribute("height",H);
  let s="";
  PHASES.forEach((p,i)=>{const w=perPhase[i]*stepX+bandPad*2;s+=`<rect x="${bandX[i]}" y="${top-32}" width="${w-6}" height="${H-top+24}" rx="8" fill="var(--soft)" opacity="${i%2?0.55:1}"/><text x="${bandX[i]+10}" y="${top-14}" font-size="11" fill="var(--muted)">${i}·${p.name.toUpperCase()}</text>`;});
  const pos={};
  UNITS.forEach((u,r)=>{const y=top+r*rowH+rowH/2;s+=`<text x="10" y="${y+4}" font-size="12" fill="var(${u.color})">${esc(u.short)}</text>`;PHASES.forEach((p,i)=>{TASKS.filter(t=>t.u===u.id&&t.ph===p.id).forEach((t,k)=>{pos[t.id]={x:bandX[i]+bandPad+k*stepX+stepX/2-6,y};});});});
  const hq=TASKS.filter(t=>t.u==="hq"),end=pos[hq[hq.length-1].id];
  UNITS.forEach(u=>{const ts=TASKS.filter(t=>t.u===u.id);if(!ts.length)return;
    if(u.id!=="hq"){const a=pos[ts[0].id],mx=end.x+26+u.n*4;s+=`<path d="M${end.x} ${end.y} H${mx} L${mx+Math.min(40,Math.abs(a.y-end.y))} ${a.y} H${a.x}" fill="none" stroke="var(${u.color})" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".35"/>`;}
    s+=`<path d="${ts.map((t,k)=>(k?"L":"M")+pos[t.id].x+" "+pos[t.id].y).join(" ")}" fill="none" stroke="var(${u.color})" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`;});
  TASKS.forEach(t=>{const q=pos[t.id],st=stateOf(t.id),c=`var(${unit(t.u).color})`;
    const fill=st==="done"?c:st==="doing"?"var(--warn)":"var(--panel)",stroke=st==="doing"?"var(--warn)":t.g?"var(--bad)":c;
    const shape=t.g?`<rect x="${q.x-8}" y="${q.y-8}" width="16" height="16" transform="rotate(45 ${q.x} ${q.y})" fill="${fill}" stroke="${stroke}" stroke-width="3"/>`:`<circle cx="${q.x}" cy="${q.y}" r="9" fill="${fill}" stroke="${stroke}" stroke-width="3"/>`;
    const tick=st==="done"?`<path d="M${q.x-4} ${q.y} l3 3 l5 -6" fill="none" stroke="var(--panel)" stroke-width="2.2" stroke-linecap="round" pointer-events="none"/>`:"";
    s+=`<g class="st" tabindex="0" role="button" data-open="${t.id}" aria-label="${esc(t.t)}, ${stLabel(st)}"><title>${esc(t.t)}</title><circle cx="${q.x}" cy="${q.y}" r="20" fill="transparent"/>${shape}${tick}</g>`;});
  svg.innerHTML=s;
  svg.querySelectorAll(".st").forEach(g=>g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();g.dispatchEvent(new Event("click"));}}));
  wire(svg);
}

}
function taskCard(t){
  const st=stateOf(t.id);
  return `<details class="task" id="task-${t.id}" ${openTask===t.id?"open":""}>
    <summary><span class="tick ${st}" aria-hidden="true"></span><span><span style="display:block;font-weight:600">${esc(t.t)}</span><span class="muted small">${esc(DEPTS[t.d].role)} · you: ${fmtMin(t.m)}${t.w?` + ${t.w}d wait`:""}</span></span><span class="chips"><span class="xpchip" style="font-size:11px;padding:1px 8px">+${xpOf(t)} XP</span>${t.g?'<span class="xpchip boss" style="font-size:11px;padding:1px 8px">⚔️ Boss</span>':""}<span class="chip ${st}">${stLabel(st)}</span></span></summary>
    <div class="tbody">

}
function viewUnits(){

  const L=LORE[u.id],pct=ts.length?Math.round(done/ts.length*100):0;
  return `${unitBar()}

    <div class="bar" style="height:10px"><i style="width:${pct}%;background:var(${u.color})"></i></div>

    <ul class="blist">${f.latest.map(b=>`<li class="done"><span class="tick done" aria-hidden="true"></span><span>${esc(b.t)}<br><span class="muted small mono">${esc(b.id)}${b.at?" · "+esc(b.at):""}${b.proof&&/^[0-9a-f]{7}$/.test(b.proof)?" · "+esc(b.proof):""}</span></span></li>`).join("")}${f.next.map(b=>`<li><span class="tick" aria-hidden="true"></span><span>${esc(b.t)}<br><span class="muted small mono">${esc(b.id)} · queued for the Build sprint</span></span></li>`).join("")}</ul></details>`;})()
  +`${byPh.map(g=>`<div class="chapter" style="--wc:var(${u.color})"><span class="num">${g.p.id+1}</span><div><h3>Chapter ${g.p.id+1}: ${esc(CHAPTERS[g.p.id])}</h3><span class="muted small">${esc(g.p.what)} · ${g.ts.filter(t=>stateOf(t.id)==="done").length}/${g.ts.length} quests</span></div></div><div class="stack" style="gap:8px">${g.ts.map(taskCard).join("")}</div>`).join("")}`;

const ORG_STATUS={code:["⚙","Live code","runs by itself"],claude:["🤖","Claude","Claude runs it in chats and scheduled tasks"],human:["🙋","Needs you","Claude prepares, you act"],planned:["🕒","Planned","designed, not built yet"]};
const TEAM_LABEL={sales:"Sales — win clients",delivery:"Delivery — run the client's automation",success:"Client success","platform-dev":"Developers","platform-test":"Test agents","platform-quality":"Quality, security & policy","platform-ops":"Release & operations","platform-pm":"PM & business analysts",hq:"HQ",game:"Game & Kingdom UI",pm:"PM",research:"Research",tech:"Builders",marketing:"Marketing",validation:"Validation"};
const SETUP_LABEL={salon:"💇 Salon",realestate:"🏠 Real Estate",gym:"🏋️ Gym",examkits:"📚 Exam Kits"};
let orgFilter="all";
function orgView(){
  const rows=ORG.filter(r=>r[2]===unitSel);
  if(!rows.length) return "";
  const cnt=k=>rows.filter(r=>r[5]===k).length;
  const groups={};for(const r of rows){const g=(r[3]?SETUP_LABEL[r[3]]+" · ":"")+(TEAM_LABEL[r[4]]||r[4]);(groups[g]=groups[g]||[]).push(r);}
  const vis=r=>orgFilter==="all"||r[5]===orgFilter;
  return `<section class="panel stack"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline"><h2>Agent org</h2><span class="muted small">${ORG.length} agents company-wide · every one has a validator</span></div>
  <p class="muted small">Each agent is a named job with a mission, a trigger, a token budget, a KPI and a validator that checks its work. The status tells you honestly how it runs today.</p>
  <div class="chips" role="group" aria-label="Filter by status"><button class="chip ${orgFilter==="all"?"on":""}" data-org="all">All ${rows.length}</button>${Object.entries(ORG_STATUS).map(([k,v])=>`<button class="chip ${orgFilter===k?"on":""}" data-org="${k}" title="${esc(v[2])}">${v[0]} ${esc(v[1])} ${cnt(k)}</button>`).join("")}</div>
  ${Object.entries(groups).map(([g,list])=>{const shown=list.filter(vis);if(!shown.length)return "";return `<details class="orggroup" ${Object.keys(groups).length<=3?"open":""}><summary><b>${esc(g)}</b> <span class="muted small">${shown.length} agent${shown.length===1?"":"s"}</span></summary><div class="stack" style="gap:6px;margin-top:8px">${shown.map(r=>`<details class="orgagent"><summary><span title="${esc(ORG_STATUS[r[5]][1])}">${ORG_STATUS[r[5]][0]}</span> ${esc(r[1])}${r[11]?' <span class="chip">needs you</span>':""}</summary><div class="small" style="margin:6px 0 4px 24px"><p>${esc(r[6])}</p><p class="muted">Trigger: ${esc(r[10])} · KPI: ${esc(r[7])}</p><p class="muted">✅ ${esc(r[8])}: ${esc(r[9])}</p></div></details>`).join("")}</div></details>`;}).join("")}
  </section>`;
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-org]");if(!b)return;orgFilter=b.dataset.org;render();});

// ---------- Agents ----------
function viewAgents(){
  const u=unit(unitSel);
  return `<section class="panel stack"><h2>Team board</h2><p class="muted small">How the agents talk: each morning run, every agent posts what it prepared and any handoff to another agent or to you. The Validator signs off before anything reaches you.</p>${feedHtml(40)}</section>
  <section class="panel stack"><h2>Who works on each unit</h2>${unitBar()}
    <p><b>You (CEO)</b> → <b style="color:var(${u.color})">${esc(u.name)} GM</b> (Claude) → 7 department agents. Budget: ${u.tokens}% of the daily Claude usage.</p>
    <div class="deptgrid">${DEPT_ORDER.map(d=>{const D=DEPTS[d],n=TASKS.filter(t=>t.u===unitSel&&t.d===d).length;return `<div class="card"><span class="eyebrow">${esc(D.name)}</span><h3>${esc(D.role)}</h3><p class="muted small">${esc(D.mandate)}</p><div class="chips"><span class="chip">${n} task${n===1?"":"s"}</span><span class="chip">${Math.round(u.tokens*D.share)/100}% budget</span></div></div>`;}).join("")}</div>
    <p class="note">Agents are roles Claude takes on when you chat or when a scheduled task runs. They never sign up, pay, sign or talk to customers as you, and never see your passwords.</p>
  </section>${orgView()}`;
}

// ---------- Plan ----------
function viewPlan(){
  const rows=PHASES.map(p=>{const ts=TASKS.filter(t=>t.ph===p.id),m=ts.reduce((a,t)=>a+t.m,0),w=Math.max(0,...ts.map(t=>t.w));return {p,m,w,d:Math.ceil(m/60)};});
  const total=rows.reduce((a,r)=>a+Math.max(r.d,r.w),0);let start=0;
  const bars=rows.map(r=>{const len=Math.max(r.d,r.w),l=start/total*100;const o=`<div class="prow"><div><b>${r.p.id}·${esc(r.p.name)}</b><div class="muted small">${esc(r.p.what)}</div></div><div class="ptrack" aria-hidden="true"><i style="left:${l}%;width:${r.d/total*100}%"></i>${r.w>r.d?`<em style="left:${l+r.d/total*100}%;width:${(r.w-r.d)/total*100}%"></em>`:""}</div><div class="mono small">${fmtMin(r.m)} · ~${len}d</div></div>`;start+=len;return o;}).join("");
  const tools=[["Code & builds","GitHub Codespaces, Expo + EAS cloud builds, Google Colab"],["Data & hosting","Supabase, Netlify, Cloudflare Pages & Workers"],["Messaging","WhatsApp Cloud API, Telegram"],["Payments","Razorpay, UPI, Dodo Payments / Gumroad, Play billing"],["Admin","Gmail, Drive & Sheets, Zoho Invoice, Bitwarden"],["AI FinOps stack","LiteLLM price map, Presidio, OpenTelemetry GenAI"],["Design","Canva"],["Paid once","Domain ~₹500–1,000/yr, Google Play $25, Chrome Web Store $5"]];
  return `<section class="panel stack"><h2>Timeline at 1 hour a day</h2><p class="muted small">Hatched parts are waits you can't speed up (KYC, Play's 14-day test, 90 days of paper trading). Other work fills them.</p><div class="stack" style="gap:10px">${bars}</div>
  <p class="note">Setup without customers: about ${rows[0].d+rows[1].d} one-hour days. First money most likely from the Studio or a Kit around weeks 6–10. All units launched in about 4–5 months.</p></section>
  <section class="panel" style="padding:0"><div style="padding:16px 16px 0"><h2>Daily Claude budget</h2><p class="muted small" style="margin-top:4px">Shares of your daily usage limit. Inside each unit: Tech 35%, Marketing 15%, Validation 15%, PM 10%, Sales 10%, Ops 10%, Finance 5%.</p></div>
  <div class="tablewrap"><table><thead><tr><th>Unit</th><th class="num">Share</th><th class="num">Done</th></tr></thead><tbody>${UNITS.map(u=>{const ts=TASKS.filter(t=>t.u===u.id);return `<tr><td><span class="sw" style="background:var(${u.color})"></span> ${esc(u.name)}</td><td class="num">${u.tokens}%</td><td class="num">${ts.filter(t=>stateOf(t.id)==="done").length}/${ts.length}</td></tr>`;}).join("")}</tbody></table></div></section>
  <section class="panel" style="padding:0"><div style="padding:16px 16px 0"><h2>Tool stack</h2><p class="muted small" style="margin-top:4px">All cloud or browser, so your PC only needs Chrome.</p></div>
  <div class="tablewrap"><table><tbody>${tools.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join("")}</tbody></table></div></section>
  ${company?`<section class="panel"><h3>Company</h3><p class="small" style="margin-top:6px">${esc(company.name)} · ${esc(company.type)} · ${esc(company.udyam)} · started ${esc(company.started)} · ${esc(company.city)}</p></section>`:""}`;
}

// ---------- Render ----------
function render(){
  renderTabs();
  const v=document.getElementById("view");
  v.innerHTML=tab==="home"?viewHome():tab==="map"?viewMap():tab==="units"?viewUnits():tab==="agents"?viewAgents():viewPlan();
  wire(v);
  v.querySelectorAll("[data-tabgo]").forEach(b=>b.addEventListener("click",()=>{tab=b.dataset.tabgo;render();window.scrollTo({top:0});}));
  v.querySelectorAll("details.task").forEach(d=>d.addEventListener("toggle",()=>{if(d.open)openTask=d.id.slice(5);}));
  if(tab==="map")drawMap();
}
function setLive(){
  const dot=document.getElementById("liveDot"),txt=document.getElementById("liveText");
  if(db&&live){dot.className="dot on";txt.textContent=canWrite?"Live · saves for you everywhere":"Live · view only";}
  else{dot.className="dot";txt.textContent="Offline · changes won't save";}
}
render();setLive();

(async()=>{
  try{
    if(!window.claude||!window.claude.use){return;}
    db=await window.claude.use("db");
    if(!db){setLive();return;}
    try{const user=await window.claude.use("user");if(user){const c=await user.can("data.write");if(c===false)canWrite=false;}}catch(e){}
    db.collection("status").onSnapshot(snap=>{live=true;snap.docs.forEach(d=>{const v=d.data();if(v&&v.s){status[d.id]=v.s;if(v.at)statusAt[d.id]=v.at;}});setLive();render();},()=>{live=false;setLive();});
    db.collection("builds").onSnapshot(snap=>{const m=new Map(builds.map(b=>[b.id,b]));snap.docs.filter(d=>d.exists).forEach(d=>{const v=d.data()||{};if(v.u&&v.t)m.set(d.id,{id:d.id,u:v.u,t:v.t,done:!!v.done,at:v.at||null,proof:v.proof||null});});builds=[...m.values()];render();},()=>{});
    db.collection("reports").onSnapshot(snap=>{reports=snap.docs.filter(d=>d.exists).map(d=>({id:d.id,data:d.data()||{}})).sort((a,b)=>a.id<b.id?1:-1).slice(0,14);render();},()=>{});
    db.collection("company").onSnapshot(snap=>{const d=snap.docs.find(x=>x.id==="profile");company=d?d.data():null;if(tab==="plan")render();},()=>{});
  }catch(e){setLive();}
})();
})();
