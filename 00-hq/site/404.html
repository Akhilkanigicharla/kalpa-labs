<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found · Kalpa Labs</title>
<meta name="description" content="This page does not exist. Go back to Kalpa Labs or chat with our AI.">
<meta name="color-scheme" content="light dark">
<style>
@font-face{font-family:"Rozha One";src:url(/fonts/rozha-one-latin-400-normal.woff) format("woff");font-display:swap}
@font-face{font-family:"Anek Latin";src:url(/fonts/anek-latin-latin-600-normal.woff) format("woff");font-weight:400 600;font-display:swap}
@font-face{font-family:"Anek Telugu";src:url(/fonts/anek-telugu-telugu-400-normal.woff) format("woff");font-display:swap}
:root{--bg:#F2EEE3;--panel:#FCFAF4;--fg:#1E2A1F;--muted:#5A6152;--rule:#DCD5C3;--accent:#2F6A3A;--accent-fg:#fff;--gold:#C38E12}
@media (prefers-color-scheme:dark){:root{--bg:#141A15;--panel:#1C241D;--fg:#EEE8D8;--muted:#A9AE9E;--rule:#2E3A2F;--accent:#7DB462;--accent-fg:#10170F}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:"Anek Latin",system-ui,sans-serif}
main{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px max(24px,env(safe-area-inset-left))}
.card{max-width:520px;width:100%;background:var(--panel);border:1px solid var(--rule);border-radius:20px;padding:32px 24px;text-align:center}
.k{color:var(--gold);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:14px;margin:0}
h1{font:400 clamp(32px,8vw,48px)/1.1 "Rozha One",serif;margin:.3em 0 .3em}
p{font-size:17px;line-height:1.5;color:var(--muted);margin:0 0 8px}
.te{font-family:"Anek Telugu","Anek Latin",sans-serif}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:24px}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:999px;font-weight:600;font-size:16px;text-decoration:none;border:2px solid var(--accent)}
a.p{background:var(--accent);color:var(--accent-fg)}
a.s{color:var(--accent)}
a.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>
<main>
 <div class="card">
  <p class="k">404 · Kalpa Labs</p>
  <h1>This page isn't here</h1>
  <p>The link may be old or mistyped. Nothing is broken on your side.</p>
  <p class="te">ఈ పేజీ దొరకలేదు. హోమ్ పేజీకి వెళ్ళండి.</p>
  <div class="row">
   <a class="btn p" href="/">Go to the home page</a>
   <a class="btn s" href="/#demo">Chat with our AI</a>
  </div>
 </div>
</main>
</body>
</html>
