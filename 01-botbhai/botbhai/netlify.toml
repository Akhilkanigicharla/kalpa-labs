[build]
  base    = "01-botbhai/botbhai"
  command = "python3 build.py"   # set env SETUP=salon|realestate|gym|examkits per industry site
  publish = "web/dist"
  functions = "core/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["core/**", "setups/**"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self)"

# Private screens and sales papers (A193): never in search results. A header also covers PDFs, which can't carry a meta tag.
[[headers]]
  for = "/sales/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/cards/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/screens/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/*.pdf"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/dashboard.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/inbox.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/billing.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/artifact.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/invoice-sample.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[functions."reminders"]
  schedule = "@hourly"

[functions."dayclose"]
  schedule = "30 15 * * *"  # 9:00 PM IST daily: owner's close-the-day list (M10)

[functions."adsbot"]
  schedule = "30 3 * * *"   # 9:00 AM IST daily
