*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:"Anek Latin",system-ui,sans-serif}
main{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px max(24px,env(safe-area-inset-left))}

p{font-size:17px;line-height:1.5;color:var(--muted);margin:0 0 8px}
.te{font-family:"Anek Telugu","Anek Latin",sans-serif}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:24px}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:999px;font-weight:600;font-size:16px;text-decoration:none;border:2px solid var(--accent)}
a.p{background:var(--accent);color:var(--accent-fg)}
a.s{color:var(--accent)}
a.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.card{position:relative;overflow:hidden}
.scene{display:block;width:min(300px,86%);height:auto;margin:-8px auto 4px}
.scene .ink{stroke:#3A2416}
@media (prefers-color-scheme:dark){.scene .ink{stroke:#E2CFA6}}
.tried{display:inline-block;max-width:100%;overflow-wrap:anywhere;font:600 14px ui-monospace,monospace;background:var(--bg);border:1px dashed var(--rule);border-radius:8px;padding:4px 10px;margin:4px 0 12px;color:var(--fg)}
.tried:empty{display:none}
.links{list-style:none;padding:0;margin:20px 0 0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.links a{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--rule);color:var(--fg);text-decoration:none;font-size:15px}
.links a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.band{height:14px;margin:-32px -24px 24px;background:radial-gradient(circle at 7px 7px,var(--gold) 2.4px,transparent 2.8px) 0 0/14px 14px repeat-x,linear-gradient(#8A4A28,#8A4A28) 0 100%/100% 1.5px no-repeat}
@media (prefers-reduced-motion:no-preference){.bot{animation:look 4s ease-in-out infinite;transform-origin:150px 150px}.leaf{animation:fall 5s ease-in-out infinite}
 @keyframes look{0%,40%,100%{transform:rotate(0)}50%,80%{transform:rotate(-6deg)}}
 @keyframes fall{0%{transform:translate(0,-30px) rotate(-30deg);opacity:0}15%{opacity:1}100%{transform:translate(-14px,40px) rotate(25deg);opacity:0}}}
