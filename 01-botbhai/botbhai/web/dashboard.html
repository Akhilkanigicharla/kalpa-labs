<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>BotBhai Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Anek+Latin:wght@400;500;600;700&family=Anek+Telugu:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Owner dashboard (A10). Brief: 01-botbhai/design/BRIEF.md. Phone first: bottom tabs under 760 px.
   Kalpa design tokens (Kalpavruksha): copied from 00-hq/design/tokens.css; keep in sync. */
:root{
  --bg:#F2EEE3; --panel:#FCFAF4; --fg:#1E2A1F; --muted:#5A6152; --rule:#DCD5C3; --soft:#E9E3D3;
  --accent:#2F6A3A; --accent-fg:#FFFFFF; --madder:#8A4A28; --gold:#C38E12; --flame:#B35E26;
  --ok:#2C7A43; --warn:#A06400; --bad:#B13A2D;
  --hero:#1D3A25; --hero-fg:#F4EEDC; --hero-mute:#BFCDAE;
  --leaf:#5E9E4C; --bark:#6B4226; --l0:#66655A; --l1:#8A4A28; --l2:#2F6F78; --l3:#3B7A3A; --l4:#7A3F5E; --l5:#9C700E; --l6:#A8324F; --l7:#4A5590;
  --f-display:"Rozha One","Noto Serif",Georgia,serif;
  --f-body:"Anek Latin","Anek Telugu",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-s:8px; --r-m:12px; --r-l:18px;
  --shadow:0 1px 0 color-mix(in srgb,var(--fg) 6%,transparent),0 10px 24px -18px color-mix(in srgb,var(--accent) 55%,transparent);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1912; --panel:#16231A; --fg:#ECE7D8; --muted:#A8B39B; --rule:#2A3A2D; --soft:#1D2C21;
  --accent:#8FCB8C; --accent-fg:#0F1912; --madder:#D98B5F; --gold:#E8B64A; --flame:#E5925A;
  --ok:#6FD08F; --warn:#E8B64A; --bad:#F07A6B;
  --hero:#17301F; --hero-fg:#F4EEDC; --hero-mute:#BFCDAE;
  --leaf:#8FCB8C; --bark:#C08A5E; --l0:#B4B3A4; --l1:#D98B5F; --l2:#6FC2CB; --l3:#6FD08F; --l4:#D59AB9; --l5:#E8B64A; --l6:#FF7F9E; --l7:#9DA8E6;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1912; --panel:#16231A; --fg:#ECE7D8; --muted:#A8B39B; --rule:#2A3A2D; --soft:#1D2C21;
  --accent:#8FCB8C; --accent-fg:#0F1912; --madder:#D98B5F; --gold:#E8B64A; --flame:#E5925A;
  --ok:#6FD08F; --warn:#E8B64A; --bad:#F07A6B;
  --hero:#17301F; --hero-fg:#F4EEDC; --hero-mute:#BFCDAE;
  --leaf:#8FCB8C; --bark:#C08A5E; --l0:#B4B3A4; --l1:#D98B5F; --l2:#6FC2CB; --l3:#6FD08F; --l4:#D59AB9; --l5:#E8B64A; --l6:#FF7F9E; --l7:#9DA8E6;
  color-scheme:dark}
:root{ --world:var(--l1);
  --temple:radial-gradient(circle at 7px 5px,var(--gold) 2.4px,transparent 2.8px) 0 0/14px 10px,radial-gradient(ellipse 3.2px 2px at 3.5px 5px,var(--leaf,#5E9E4C) 90%,transparent) 0 0/7px 10px; }
*{box-sizing:border-box}
[hidden]{display:none!important}
a{color:var(--accent)}
html,body{min-height:100%}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(color-mix(in srgb,var(--accent) 13%,transparent) 1px,transparent 1.4px);background-size:18px 18px;color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{max-width:900px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
header.hero{position:relative;overflow:hidden;background:radial-gradient(circle at 100% 0,transparent 0 60px,color-mix(in srgb,var(--gold) 45%,var(--hero)) 61px 62px,transparent 63px),var(--hero);color:var(--hero-fg);border-radius:var(--r-l);padding:24px 16px 20px;box-shadow:0 18px 40px -22px #1D3A25}
header.hero::before,header.hero::after{content:"";position:absolute;left:0;right:0;height:10px;background:var(--temple);opacity:.9}
header.hero::before{top:0}header.hero::after{bottom:0;transform:scaleY(-1)}
.eyebrow{font:600 11.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:0 0 4px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,6vw,36px);line-height:1.1;margin:0}
h2{font:400 21px/1.15 var(--f-display);margin:0}
.hero small{color:var(--hero-mute)}
.demo-flag{display:inline-block;margin-left:8px;background:var(--gold);color:#1E2A1F;border-radius:999px;padding:1px 8px;font:600 11px var(--f-mono);vertical-align:middle}
/* tabs: top on wide screens, bottom bar on phones */
.tabs{display:flex;gap:8px}
.tab{min-height:44px;border:1px solid var(--rule);background:var(--panel);color:var(--muted);font-weight:600;font-size:14px;padding:8px 16px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;position:relative}
.tab[aria-selected="true"]{color:var(--hero-fg);background:var(--hero);border-color:var(--hero)}
.badge{min-width:20px;height:20px;border-radius:999px;background:var(--bad);color:#fff;font:600 11.5px/20px var(--f-mono);text-align:center;padding:0 8px}
@media (max-width:759px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--panel);border-top:1px solid var(--rule);padding:8px 8px calc(8px + env(safe-area-inset-bottom));justify-content:space-around;gap:2px;box-shadow:0 -8px 24px -18px rgba(0,0,0,.4)}
  .tab{flex:1;flex-direction:column;gap:0;border:0;background:none;border-radius:var(--r-m);padding:4px 2px;font-size:12px;min-height:52px}
  .tab .ico{display:block}
  .tab[aria-selected="true"]{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
  .tab .badge{position:absolute;top:2px;right:calc(50% - 22px)}
}
@media (min-width:760px){.tab .ico{display:none}}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-l);box-shadow:var(--shadow);padding:16px;min-width:0}
.card > * + *{margin-top:12px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kpi{position:relative;overflow:hidden;border:1px solid var(--rule);border-radius:var(--r-m);padding:16px 12px 12px;background:var(--panel);text-align:left;cursor:pointer;min-height:92px}
.kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(135deg,var(--world) 0 25%,transparent 25% 50%,var(--world) 50% 75%,transparent 75%) 0 0/8px 6px,color-mix(in srgb,var(--world) 30%,transparent)}
.kpi b{display:block;font:400 30px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi span{font:600 10.5px var(--f-mono);color:var(--muted)}
.kpi.alert b{color:var(--bad)}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.slot{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule)}
.slot:last-child{border-bottom:0}
.slot time{font:600 13px var(--f-mono);color:var(--muted)}
.slot .who{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .what{color:var(--muted);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.past{opacity:.6}
.slot.now{background:color-mix(in srgb,var(--gold) 10%,transparent);border-radius:var(--r-s);padding-inline:8px;margin-inline:-8px}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font:600 11px var(--f-mono);white-space:nowrap}
.pill.booked{background:color-mix(in srgb,var(--l2) 16%,transparent);color:var(--l2)}
.pill.sure{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.came{background:var(--soft);color:var(--muted)}
.pill.noshow,.pill.hot{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.cancelled{background:var(--soft);color:var(--muted);text-decoration:line-through}
.pill.warm{background:color-mix(in srgb,var(--flame) 16%,transparent);color:var(--flame)}
.pill.cold{background:color-mix(in srgb,var(--l2) 14%,transparent);color:var(--l2)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:13px}
.empty{padding:24px 8px;text-align:center;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.chip{min-height:44px;border:1px solid var(--rule);background:none;color:var(--muted);font-weight:600;font-size:14px;padding:8px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{color:var(--hero-fg);background:var(--hero);border-color:var(--hero)}
.search{width:100%;min-height:44px;border:1px solid var(--rule);background:var(--panel);border-radius:var(--r-s);padding:8px 12px;font-size:15px}
.leads{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lead{border:1px solid var(--rule);border-radius:var(--r-m);padding:12px 12px;display:flex;flex-direction:column;gap:4px}
.lead .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.lead b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lead a.tel{font:400 13px var(--f-mono);text-decoration:none;min-height:32px;display:inline-flex;align-items:center}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:560px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:8px}
.bar{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.bar i{display:block;width:100%;max-width:26px;border-radius:5px 5px 2px 2px;background:var(--world);min-height:2px}
.bar.today i{background:var(--gold)}
.bar span{font:400 10px var(--f-mono);color:var(--muted)}
.btn{min-height:44px;border:0;border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;cursor:pointer;background:var(--accent);color:var(--accent-fg);text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--rule)}
.skeleton{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--soft),var(--rule),var(--soft));background-size:200% 100%;animation:sk 1.2s infinite linear;margin:12px 0}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skeleton{animation:none}}
.signin{display:flex;flex-direction:column;gap:12px}.signin p{margin:0;color:var(--muted)}
.inline{display:flex;gap:8px}.inline input{flex:1;min-width:0;min-height:44px;border:1px solid var(--rule);background:var(--panel);border-radius:var(--r-s);padding:8px 12px;font-size:15px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));margin:0 auto;max-width:520px;background:var(--hero);color:var(--hero-fg);border-radius:var(--r-m);padding:12px 16px;box-shadow:var(--shadow);font-size:14px;z-index:9}
footer{color:var(--muted);font-size:12.5px;text-align:center}
#key[aria-invalid=true]{border-color:var(--warn);box-shadow:0 0 0 2px var(--warn)}
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <h1 id="biz">Your salon</h1>
    <p class="eyebrow">BotBhai · Owner dashboard</p>
    <small id="today-label"></small>
  </header>

  <section class="card signin" id="signin" hidden aria-labelledby="signin-h">
    <h2 id="signin-h">Open your dashboard</h2>
    <p>Paste the key from your BotBhai setup message. It stays on this phone only, and also opens your inbox.</p>
    <form id="signin-form" class="inline">
      <label class="sr" for="key">Dashboard key</label>
      <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="36-character key" required>
      <button class="btn" type="submit">Open</button>
    </form>
    <p id="signin-err" role="alert"></p>
    <p><a href="?demo=1">See a demo with sample data</a></p>
  </section>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections" hidden>
    <button class="tab" role="tab" data-tab="today" aria-selected="true"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Today</button>
    <button class="tab" role="tab" data-tab="leads" aria-selected="false"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.5 3.2-5.5 6.5-5.5s6 2 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c2 .7 3.2 2.6 3.5 5.2"/></svg>Leads</button>
    <a class="tab" id="inbox-tab" href="inbox.html" aria-selected="false"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5h16v10H9l-5 4z"/></svg>Inbox<span class="badge" id="waiting" hidden></span></a>
    <button class="tab" role="tab" data-tab="report" aria-selected="false"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V4M4 20h16M8 16v-4M12 16V8M16 16v-6"/></svg>Report</button>
  </nav>

  <main id="main" hidden>
    <section id="pane-today" role="tabpanel" aria-label="Today">
      <div class="kpis" id="kpis"></div>
      <div class="card" style="margin-top:16px"><div class="row"><h2>Today's bookings</h2><span class="muted small" id="tomorrow"></span></div><ul class="timeline" id="timeline"><li><div class="skeleton"></div><div class="skeleton"></div></li></ul></div>
    </section>
    <section id="pane-leads" role="tabpanel" aria-label="Leads" hidden>
      <div class="card">
        <h2>Leads</h2>
        <div class="chips" role="group" aria-label="Filter">
          <button class="chip" data-f="hot" aria-pressed="true">Hot</button>
          <button class="chip" data-f="callback" aria-pressed="false">Call back</button>
          <button class="chip" data-f="booked" aria-pressed="false">Booked</button>
          <button class="chip" data-f="all" aria-pressed="false">All</button>
        </div>
        <label class="sr" for="q">Search leads</label><input class="search" id="q" type="search" placeholder="Search name, service or number">
        <ul class="leads" id="leads"></ul>
      </div>
    </section>
    <section id="pane-report" role="tabpanel" aria-label="Report" hidden>
      <div class="card">
        <h2>Last 30 days</h2>
        <div class="stats" id="stats"></div>
        <div><p class="eyebrow" style="color:var(--muted)">Bookings per day · last 14 days</p><div class="bars" id="bars" role="img"></div></div>
        <p class="muted small" id="sources"></p>
        <div class="row"><button class="btn ghost" id="dl-leads">Download leads (Excel)</button><button class="btn ghost" id="dl-bookings">Download bookings (Excel)</button></div>
      </div>
    </section>
  </main>
  <footer id="foot"></footer>
</div>
<p class="toast" id="toast" role="status" hidden></p>

<script src="dashboard.js"></script>
</body>
</html>
