<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kalpa Bhasha Kids</title>
<meta name="description" content="Telugu and Hindi practice for kids. No accounts, works offline, progress stays on this device.">
<meta name="theme-color" content="#1D3A25">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; font-src 'self'; media-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/tokens.css">
<link rel="stylesheet" href="app.css">

<body>
<header class="hero">
  <div class="hero-in">
    <button class="brand" data-act="home" aria-label="Home">
      <img src="icon.svg" alt="" width="40" height="40">
      <span><b>Bhasha Kids</b><small>Kalpa Labs</small></span>
    </button>
    <span class="chip" id="streak" aria-live="polite"></span>
    <button class="grown" data-act="gate">Grown-ups</button>
  </div>
</header>
<main id="app" tabindex="-1"><p class="loading">Loading lessons...</p></main>
<p class="sr" id="live" aria-live="polite"></p>

<script type="module" src="app.js"></script>

</html>
