# JobCard site on Netlify (free). Base directory: 02-jobcard
[build]
  command = "npm ci && node web/build.mjs"   # needs SUPABASE_URL + SUPABASE_ANON_KEY (public) in Netlify env
  publish = "web"

[functions]
  directory = "bot/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"
    X-Frame-Options = "DENY"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    # Supabase (data + live updates) is the only outside host the app talks to
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# A186: any unknown path opens the app (single-page app; no dead pages). Real files win (no force).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
