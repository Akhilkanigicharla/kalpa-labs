# RRB NTPC · Kalpa exam kit data. How to edit: see ../README.md.
# Syllabus: CBT 1 / CBT 2 subjects as listed in recent RRB NTPC CEN notices (graduate and undergraduate levels share them).
# Re-check against the next CEN before selling (data gap NTPC-1).
id: rrb-ntpc
short: RRB NTPC
name: RRB Non-Technical Popular Categories (NTPC)
body: Railway Recruitment Boards (RRBs)
category: central-govt
official_site: https://www.rrbapply.gov.in
languages: [en]
checked_on: 2026-11-07

stages:
  - {name: "CBT 1 · Mathematics, General Intelligence and Reasoning, General Awareness (screening)"}
  - {name: "CBT 2 · same subjects, higher level (counts for merit)"}
  - {name: "Typing Skill Test (clerk / typist posts) or CBAT (Station Master, Traffic Assistant)"}
  - {name: "Document verification and medical exam"}

key_dates:
  - {event: "Next CEN (notification)", status: NOT_ANNOUNCED, date: null, source: "https://www.rrbapply.gov.in", note: "Check rrbapply.gov.in and your regional RRB site."}
  - {event: "Last date to apply", status: NOT_ANNOUNCED, date: null, source: null, note: "Given in the CEN."}
  - {event: "CBT 1", status: NOT_ANNOUNCED, date: null, source: null, note: ""}
  - {event: "CBT 1 result", status: NOT_ANNOUNCED, date: null, source: null, note: ""}
  - {event: "CBT 2", status: NOT_ANNOUNCED, date: null, source: null, note: ""}
  - {event: "Typing Skill Test / CBAT", status: NOT_ANNOUNCED, date: null, source: null, note: ""}

plan: {topics_per_day: 2, reminder_time: "07:00", revision_days: [1, 3, 7, 21]}

materials:
  - {title: "RRB apply portal: CEN notices, syllabus, answer keys", url: "https://www.rrbapply.gov.in", kind: official, status: TO_VERIFY}
  - {title: "NCERT textbooks up to class 10 (free; RRB general science is 10th CBSE level)", url: "https://ncert.nic.in/textbook.php", kind: textbook, status: TO_VERIFY}
  - {title: "PIB press releases for current affairs", url: "https://pib.gov.in", kind: current-affairs, status: TO_VERIFY}
  - {title: "Indian Railways official site (railway GK)", url: "https://indianrailways.gov.in", kind: official, status: TO_VERIFY}

