# SSC CGL · Kalpa exam kit data. How to edit: see ../README.md.
# Syllabus: Tier 1 + Tier 2 subjects as in recent SSC CGL notices. Re-check against the new notice before selling (data gap CGL-1).
id: ssc-cgl
short: SSC CGL
name: SSC Combined Graduate Level Examination
body: Staff Selection Commission (SSC)
category: central-govt
official_site: https://ssc.gov.in
languages: [en]
checked_on: 2026-11-07

stages:
  - {name: "Tier 1 · CBT: Reasoning, General Awareness, Quantitative Aptitude, English (screening)"}
  - {name: "Tier 2 · Paper I: Maths, Reasoning, English, General Awareness, Computer Knowledge, Data Entry Speed Test"}
  - {name: "Tier 2 · Paper II: Statistics (only for JSO posts)"}
  - {name: "Document verification and post preference"}

key_dates:
  - {event: "Notification (next CGL cycle)", status: NOT_ANNOUNCED, date: null, source: "https://ssc.gov.in", note: "Check the SSC exam calendar and notice board on ssc.gov.in."}
  - {event: "Last date to apply", status: NOT_ANNOUNCED, date: null, source: null, note: "Given in the notice."}
  - {event: "Tier 1 exam", status: NOT_ANNOUNCED, date: null, source: null, note: ""}
  - {event: "Tier 1 result", status: NOT_ANNOUNCED, date: null, source: null, note: ""}
  - {event: "Tier 2 exam", status: NOT_ANNOUNCED, date: null, source: null, note: ""}
  - {event: "Final result", status: NOT_ANNOUNCED, date: null, source: null, note: ""}

plan: {topics_per_day: 2, reminder_time: "07:00", revision_days: [1, 3, 7, 21]}

materials:
  - {title: "SSC official site: notices, syllabus, previous answer keys", url: "https://ssc.gov.in", kind: official, status: TO_VERIFY}
  - {title: "NCERT textbooks (free PDFs: history, geography, polity, science)", url: "https://ncert.nic.in/textbook.php", kind: textbook, status: TO_VERIFY}
  - {title: "PIB press releases for current affairs", url: "https://pib.gov.in", kind: current-affairs, status: TO_VERIFY}
  - {title: "Economic Survey of India (free)", url: "https://www.indiabudget.gov.in", kind: official, status: TO_VERIFY}
  - {title: "NIOS free study material (maths, science, social science)", url: "https://www.nios.ac.in", kind: textbook, status: TO_VERIFY}

youtube:
